<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 330" width="1000" height="330" role="img"
     aria-label="Two users choose the same password. Without a salt they get the same stored hash, so one list cracks both. With a per-user random salt stored next to the hash, the same password gives two different stored hashes, so one precomputed list no longer cracks the whole file.">
  <title>A per-user salt makes identical passwords store differently</title>
  <style>
    .b  { fill: #fffdf9; stroke: #017BC4; stroke-width: 2 }
    .bo { fill: #fff6f0; stroke: #E35205; stroke-width: 2 }
    .bg { fill: #f3f4f6; stroke: #6b7280; stroke-width: 1.5 }
    .t  { font: 600 16px system-ui, sans-serif; fill: #16191d; text-anchor: middle }
    .ts { font: 500 13px system-ui, sans-serif; fill: #374151; text-anchor: middle }
    .tm { font: 600 13px ui-monospace, Menlo, monospace; fill: #16191d; text-anchor: middle }
    .tb { font: 700 15px system-ui, sans-serif; fill: #017BC4; text-anchor: middle }
    .to { font: 700 15px system-ui, sans-serif; fill: #E35205; text-anchor: middle }
    .hl { font: 700 17px system-ui, sans-serif; text-anchor: middle }
    .a  { stroke: #16191d; stroke-width: 1.8; fill: none; marker-end: url(#ar) }
    @media (prefers-color-scheme: dark) {
      .b  { fill: #151a20; stroke: #4aa3dd } .bo { fill: #2a1c14; stroke: #ff7a3d }
      .bg { fill: #22262b; stroke: #9aa3ad }
      .t, .tm { fill: #e6e8ea } .ts { fill: #b8c0c8 }
      .tb { fill: #4aa3dd } .to { fill: #ff7a3d }
      .a  { stroke: #c9ced3 }
      [fill="#16191d"] { fill: #c9ced3 }
      [fill="#017BC4"] { fill: #4aa3dd } [stroke="#017BC4"] { stroke: #4aa3dd }
      [fill="#E35205"] { fill: #ff7a3d } [stroke="#E35205"] { stroke: #ff7a3d }
    }
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#16191d"/></marker>
  </defs>

  <!-- same password, two users -->
  <text class="t" x="130" y="40">Two users, same password</text>
  <rect class="bg" x="30" y="60" width="200" height="40" rx="8"/><text class="tm" x="130" y="85">alice : "hunter2"</text>
  <rect class="bg" x="30" y="115" width="200" height="40" rx="8"/><text class="tm" x="130" y="140">bob&#160;&#160;&#160;: "hunter2"</text>

  <!-- NO SALT branch -->
  <path class="a" d="M235,80 H330"/>
  <path class="a" d="M235,135 H330"/>
  <rect class="bo" x="330" y="55" width="300" height="105" rx="10"/>
  <text class="to" x="480" y="80">No salt</text>
  <text class="tm" x="480" y="108">alice → 9b2c…f1</text>
  <text class="tm" x="480" y="132">bob&#160;&#160;&#160;→ 9b2c…f1</text>
  <text class="ts" x="480" y="152">identical — one list cracks both</text>

  <!-- SALT branch -->
  <path class="a" d="M235,90 C300,190 300,210 330,235"/>
  <path class="a" d="M235,145 C300,210 300,225 330,255"/>
  <rect class="b" x="330" y="190" width="640" height="115" rx="10"/>
  <text class="tb" x="650" y="214">Per-user random salt, stored next to the hash (not secret)</text>
  <text class="tm" x="650" y="244">alice : salt=Qm4z → hash(Qm4z + "hunter2") = c4fe…17</text>
  <text class="tm" x="650" y="272">bob&#160;&#160;&#160;: salt=Lp8w → hash(Lp8w + "hunter2") = 59a3…b8</text>
  <text class="ts" x="650" y="296">different stored hashes — one precomputed list no longer cracks the file</text>

  <!-- fixed store note -->
  <text class="to" x="480" y="192">✗</text>
  <text class="tb" x="650" y="180">✓</text>
</svg>
