services:
  vulnerable:
    build: .
    command: python vulnerable_app.py
    environment:
      - FLAG_REMEDIATE=${FLAG_REMEDIATE:-FLAG{inverted_allowlist_leaves_ssh_open}}
    ports:
      # 127.0.0.1 = this machine only. Lab apps are deliberately vulnerable; keep them off the classroom network.
      - "127.0.0.1:8115:5000"

  fixed:
    build: .
    command: python fixed_app.py
    environment:
      - FLAG_REMEDIATE=${FLAG_REMEDIATE:-FLAG{inverted_allowlist_leaves_ssh_open}}
    ports:
      # 127.0.0.1 = this machine only. Lab apps are deliberately vulnerable; keep them off the classroom network.
      - "127.0.0.1:8116:5000"
