<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 340" width="760" height="258" role="img" aria-label="Four steps. 1: Bob makes a key pair and publishes only the public key. 2: the server hands the public key to Alice. 3: Alice encrypts on her own device with Bob's public key and sends ciphertext. 4: the server stores and logs only ciphertext, and Bob decrypts with his private key, which never leaves his device.">
  <title>The fix: encrypt on Alice's device</title>
  <style>
    .b  { fill: #fffdf9; stroke: #017BC4; stroke-width: 2 }
    .bo { fill: #fff6f0; stroke: #E35205; stroke-width: 2 }
    .bg { fill: #f3f4f6; stroke: #6b7280; stroke-width: 1.5 }
    .bgr{ fill: #eef8f0; stroke: #2f855a; stroke-width: 2 }
    .br { fill: #fdeeee; stroke: #c53030; stroke-width: 2 }
    .t  { font: 700 18px system-ui, sans-serif; fill: #16191d; text-anchor: middle }
    .ts { font: 500 14px system-ui, sans-serif; fill: #374151; text-anchor: middle }
    .tm { font: 600 14px ui-monospace, Menlo, monospace; fill: #16191d; text-anchor: middle }
    .tb { font: 700 16px system-ui, sans-serif; fill: #017BC4; text-anchor: middle }
    .to { font: 700 16px system-ui, sans-serif; fill: #E35205; text-anchor: middle }
    .tg { font: 700 16px system-ui, sans-serif; fill: #2f855a; text-anchor: middle }
    .tr { font: 700 16px system-ui, sans-serif; fill: #c53030; text-anchor: middle }
    .a  { stroke: #16191d; stroke-width: 1.8; fill: none; marker-end: url(#ar) }
    .ao { stroke: #E35205; stroke-width: 2.2; fill: none; marker-end: url(#aro) }
    .ab { stroke: #017BC4; stroke-width: 2.2; fill: none; marker-end: url(#arb) }
    .ad { stroke: #E35205; stroke-width: 2.2; fill: none; stroke-dasharray: 6 5; marker-end: url(#aro) }
    @media (prefers-color-scheme: dark) {
      .b  { fill: #151a20; stroke: #4aa3dd } .bo { fill: #2a1c14; stroke: #ff7a3d }
      .bg { fill: #22262b; stroke: #9aa3ad } .bgr { fill: #14251a; stroke: #5fbf8a } .br { fill: #2a1515; stroke: #f08080 }
      .t, .tm { fill: #e6e8ea } .ts { fill: #b8c0c8 }
      .tb { fill: #4aa3dd } .to { fill: #ff7a3d } .tg { fill: #5fbf8a } .tr { fill: #f08080 }
      .a  { stroke: #c9ced3 } .ao, .ad { stroke: #ff7a3d } .ab { stroke: #4aa3dd }
      [fill="#16191d"] { fill: #c9ced3 }
    }
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#16191d"/></marker>
    <marker id="aro" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#E35205"/></marker>
    <marker id="arb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#017BC4"/></marker>
  </defs>
  <text class="t" x="500" y="28">Same server code, different payload from Alice</text>
  <rect class="b" x="20" y="55" width="210" height="170" rx="12"/>
  <text class="tb" x="125" y="92" style="font-size:24px">1  Bob</text>
  <text class="ts" x="125" y="128">makes a key pair,</text>
  <text class="ts" x="125" y="152">publishes only</text>
  <text class="ts" x="125" y="176">the public key</text>
  <rect class="bg" x="270" y="55" width="210" height="170" rx="12"/>
  <text class="tm" x="375" y="92" style="font-size:24px">2  Server</text>
  <text class="ts" x="375" y="128">hands the public</text>
  <text class="ts" x="375" y="152">key to Alice</text>
  <text class="ts" x="375" y="176">(still a relay)</text>
  <rect class="bo" x="520" y="55" width="210" height="170" rx="12"/>
  <text class="to" x="625" y="92" style="font-size:24px">3  Alice</text>
  <text class="ts" x="625" y="128">encrypts here with</text>
  <text class="ts" x="625" y="152">Bob's public key</text>
  <text class="ts" x="625" y="176">and sends it</text>
  <rect class="bgr" x="770" y="55" width="210" height="170" rx="12"/>
  <text class="tg" x="875" y="92" style="font-size:24px">4  Bob</text>
  <text class="ts" x="875" y="128">decrypts with his</text>
  <text class="ts" x="875" y="152">private key,</text>
  <text class="ts" x="875" y="176">it never leaves</text>
  <path class="a" d="M232,140 H266"/>
  <path class="a" d="M482,140 H516"/>
  <path class="a" d="M732,140 H766"/>
  <rect class="bgr" x="270" y="255" width="470" height="60" rx="8"/>
  <text class="tg" x="505.0" y="278.0">The server log now shows only unreadable text</text>
  <text class="ts" x="505.0" y="302.0">SERVER SAW: eyJlbmNfa2V5…</text>
</svg>
