<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 405" width="760" height="308" role="img" aria-label="A TLS handshake between Alice, the client, and the server has three jobs. Job 1, key exchange: both sides send key shares and agree on a session key, which gives secrecy. Job 2, the server sends its certificate saying it is bob, and Alice must check who vouches for it; this is where this week's bug lives. Job 3, CertificateVerify: the server signs with its private key to prove it holds the key for that certificate. Skip any one of the three and a man in the middle is back.">
  <title>The three jobs of a TLS handshake</title>
  <style>
    .b  { fill: #fffdf9; stroke: #017BC4; stroke-width: 2 }
    .bo { fill: #fff6f0; stroke: #E35205; stroke-width: 2 }
    .bg { fill: #f3f4f6; stroke: #6b7280; stroke-width: 1.5 }
    .bgr{ fill: #eef8f0; stroke: #2f855a; stroke-width: 2 }
    .br { fill: #fdeeee; stroke: #c53030; stroke-width: 2 }
    .t  { font: 700 18px system-ui, sans-serif; fill: #16191d; text-anchor: middle }
    .ts { font: 500 14px system-ui, sans-serif; fill: #374151; text-anchor: middle }
    .tm { font: 600 14px ui-monospace, Menlo, monospace; fill: #16191d; text-anchor: middle }
    .tb { font: 700 16px system-ui, sans-serif; fill: #017BC4; text-anchor: middle }
    .to { font: 700 16px system-ui, sans-serif; fill: #E35205; text-anchor: middle }
    .tg { font: 700 16px system-ui, sans-serif; fill: #2f855a; text-anchor: middle }
    .tr { font: 700 16px system-ui, sans-serif; fill: #c53030; text-anchor: middle }
    .a  { stroke: #16191d; stroke-width: 1.8; fill: none; marker-end: url(#ar) }
    .ao { stroke: #E35205; stroke-width: 2.2; fill: none; marker-end: url(#aro) }
    .ab { stroke: #017BC4; stroke-width: 2.2; fill: none; marker-end: url(#arb) }
    .ad { stroke: #E35205; stroke-width: 2.2; fill: none; stroke-dasharray: 6 5; marker-end: url(#aro) }
    @media (prefers-color-scheme: dark) {
      .b  { fill: #151a20; stroke: #4aa3dd } .bo { fill: #2a1c14; stroke: #ff7a3d }
      .bg { fill: #22262b; stroke: #9aa3ad } .bgr { fill: #14251a; stroke: #5fbf8a } .br { fill: #2a1515; stroke: #f08080 }
      .t, .tm { fill: #e6e8ea } .ts { fill: #b8c0c8 }
      .tb { fill: #4aa3dd } .to { fill: #ff7a3d } .tg { fill: #5fbf8a } .tr { fill: #f08080 }
      .a  { stroke: #c9ced3 } .ao, .ad { stroke: #ff7a3d } .ab { stroke: #4aa3dd }
      [fill="#16191d"] { fill: #c9ced3 }
    }
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#16191d"/></marker>
    <marker id="aro" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#E35205"/></marker>
    <marker id="arb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#017BC4"/></marker>
  </defs>
  <text class="t" x="500" y="28">A TLS handshake does three jobs</text>
  <rect class="b" x="30" y="50" width="170" height="305" rx="12"/>
  <text class="tb" x="115" y="85">Alice</text>
  <text class="ts" x="115" y="108">the client</text>
  <rect class="bgr" x="800" y="50" width="170" height="305" rx="12"/>
  <text class="tg" x="885" y="85">Bob</text>
  <text class="ts" x="885" y="108">the server</text>
  <text class="tb" x="500" y="78">1  Key exchange: agree on a session key</text>
  <path class="ab" d="M215,96 H785"/>
  <path class="ab" d="M785,114 H215"/>
  <text class="ts" x="500" y="140">secrecy: a listener cannot read the data</text>
  <rect class="bo" x="228" y="168" width="544" height="98" rx="10"/>
  <text class="to" x="500" y="192">2  Certificate: "I am bob"</text>
  <path class="ao" d="M785,208 H215"/>
  <text class="to" x="500" y="238">Alice must check: who vouches for this?</text>
  <text class="ts" x="500" y="257">this week's bug lives here</text>
  <text class="tb" x="500" y="300">3  CertificateVerify: signed with the private key</text>
  <path class="ab" d="M785,316 H215"/>
  <text class="ts" x="500" y="343">proves the server holds the key for that certificate</text>
  <text class="t" x="500" y="385">Skip any one of the three and a man in the middle is back</text>
</svg>
