<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 500" role="img" aria-label="How Sigstore keyless signing works, with no long-lived private key on disk. Top row, the sign path, left to right in four steps. Step 1, the developer runs cosign sign and authenticates with an existing OIDC identity, their GitHub or Google login, so there is no key to generate or store. Step 2, Fulcio, the certificate authority, issues a short-lived certificate, valid about ten minutes, bound to that identity. Step 3, cosign signs the artifact with the ephemeral key tied to that certificate, then the key is immediately discarded. Step 4, the signature and certificate are recorded in Rekor, the public append-only transparency log, so the signing event is permanent and auditable. A note beneath the sign path, highlighted: nothing long-lived is ever written to disk, so there is no private key to leak, which is how CWE-321, use of a hard-coded or long-lived cryptographic key, is avoided. Bottom row, the verify gate at deploy time. cosign verify checks the artifact's signature against the expected identity and the Rekor log. If the signature is valid and the identity matches, the result is pass and the image is allowed to deploy. If the image is unsigned or tampered, the result is cosign returning no signatures found, and the deployment gate blocks it. The closing line: you are not trusting a key that could be stolen, you are trusting a logged identity that cannot be forged without also forging the public transparency record.">
  <title>Sigstore keyless signing — an identity, not a key on disk</title>
  <style>
    .bg     { fill:#ffffff; }
    .title  { fill:#111827; font:700 19px system-ui,sans-serif; }
    .sub    { fill:#6b7280; font:400 12.5px system-ui,sans-serif; }
    .lane   { fill:#4b5563; font:700 12px system-ui,sans-serif; letter-spacing:0.6px; }
    .rule   { stroke:#d7dde3; stroke-width:1.5; }

    .step   { fill:#f2f8fc; stroke:#017BC4; stroke-width:2; }
    .stepn  { fill:#017BC4; }
    .stepnt { fill:#ffffff; font:700 12px system-ui,sans-serif; }
    .stept  { fill:#0f2233; font:700 12.5px system-ui,sans-serif; }
    .steps  { fill:#6b7280; font:400 10.5px system-ui,sans-serif; }
    .mono   { font-family:ui-monospace,Menlo,Consolas,monospace; }

    .svc    { fill:#015a8f; font:700 11px system-ui,sans-serif; }
    .spine  { stroke:#017BC4; stroke-width:2.5; fill:none; }
    .ahb    { fill:#017BC4; }

    .note   { fill:#f4f9fd; stroke:#017BC4; stroke-width:1.8; }
    .noteacc{ fill:#017BC4; }
    .noteh  { fill:#015a8f; font:700 12.5px system-ui,sans-serif; }
    .notel  { fill:#374151; font:400 11px system-ui,sans-serif; }

    .pass   { fill:#f2f8fc; stroke:#017BC4; stroke-width:2; }
    .passh  { fill:#015a8f; font:700 12.5px system-ui,sans-serif; }
    .fail   { fill:#fff6f1; stroke:#E35205; stroke-width:2; }
    .failh  { fill:#b23f00; font:700 12.5px system-ui,sans-serif; }
    .gate   { fill:#0f2233; font:700 13px system-ui,sans-serif; }
    .line   { fill:#374151; font:400 11px system-ui,sans-serif; }
    .glyphC { fill:#017BC4; }
    .glyphA { fill:#E35205; }
    .tick   { stroke:#ffffff; stroke-width:2; fill:none; stroke-linecap:round; stroke-linejoin:round; }
    .cross  { stroke:#ffffff; stroke-width:2; fill:none; stroke-linecap:round; }

    .banner { fill:#f4f9fd; stroke:#017BC4; stroke-width:2; }
    .bant   { fill:#0f2233; font:700 13px system-ui,sans-serif; }

    @media (prefers-color-scheme: dark) {
      .bg     { fill:#0b1016; }
      .title  { fill:#f3f4f6; }
      .sub    { fill:#9aa3ad; }
      .lane   { fill:#c4ccd4; }
      .rule   { stroke:#33404c; }

      .step   { fill:#101d27; stroke:#4aa3dd; }
      .stepn  { fill:#4aa3dd; }
      .stepnt { fill:#0b1016; }
      .stept  { fill:#e5eef5; }
      .steps  { fill:#9aa3ad; }

      .svc    { fill:#4aa3dd; }
      .spine  { stroke:#4aa3dd; }
      .ahb    { fill:#4aa3dd; }

      .note   { fill:#0f1c26; stroke:#4aa3dd; }
      .noteacc{ fill:#4aa3dd; }
      .noteh  { fill:#4aa3dd; }
      .notel  { fill:#c4ccd4; }

      .pass   { fill:#101d27; stroke:#4aa3dd; }
      .passh  { fill:#4aa3dd; }
      .fail   { fill:#241812; stroke:#ff7a3d; }
      .failh  { fill:#ff7a3d; }
      .gate   { fill:#e5eef5; }
      .line   { fill:#c4ccd4; }
      .glyphC { fill:#4aa3dd; }
      .glyphA { fill:#ff7a3d; }
      .tick   { stroke:#0b1016; }
      .cross  { stroke:#241812; }

      .banner { fill:#0f1c26; stroke:#4aa3dd; }
      .bant   { fill:#e5eef5; }
    }
  </style>

  <rect class="bg" x="0" y="0" width="720" height="500"/>

  <defs>
    <marker id="kahb" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="ahb" d="M0,0 L10,5 L0,10 z"/>
    </marker>
  </defs>

  <!-- ============ HEADER ============ -->
  <text class="title" x="30" y="32">Sigstore keyless signing — an identity, not a key on disk</text>
  <text class="sub" x="30" y="54">Week 12 · OWASP 2025 A08 Integrity · avoids CWE-321 (long-lived key)</text>

  <!-- ============ SIGN LANE ============ -->
  <text class="lane" x="30" y="86">SIGN  ·  cosign sign</text>
  <line class="rule" x1="30" y1="94" x2="690" y2="94"/>

  <!-- connectors between the 4 steps -->
  <path class="spine" d="M194,150 L206,150" marker-end="url(#kahb)"/>
  <path class="spine" d="M362,150 L374,150" marker-end="url(#kahb)"/>
  <path class="spine" d="M530,150 L542,150" marker-end="url(#kahb)"/>

  <!-- step 1 -->
  <rect class="step" x="30" y="110" width="164" height="80" rx="8"/>
  <circle class="stepn" cx="50" cy="130" r="11"/>
  <text class="stepnt" x="50" y="134" text-anchor="middle">1</text>
  <text class="stept" x="68" y="134">Developer</text>
  <text class="steps" x="44" y="158">authenticate via OIDC</text>
  <text class="steps mono" x="44" y="174">GitHub / Google login</text>
  <text class="steps" x="44" y="186" style="font-weight:700">no key to generate</text>

  <!-- step 2 -->
  <rect class="step" x="206" y="110" width="156" height="80" rx="8"/>
  <circle class="stepn" cx="226" cy="130" r="11"/>
  <text class="stepnt" x="226" y="134" text-anchor="middle">2</text>
  <text class="svc" x="244" y="134">FULCIO (CA)</text>
  <text class="steps" x="220" y="158">issues a short-lived</text>
  <text class="steps" x="220" y="174">certificate (~10 min)</text>
  <text class="steps" x="220" y="186" style="font-weight:700">bound to your identity</text>

  <!-- step 3 -->
  <rect class="step" x="374" y="110" width="156" height="80" rx="8"/>
  <circle class="stepn" cx="394" cy="130" r="11"/>
  <text class="stepnt" x="394" y="134" text-anchor="middle">3</text>
  <text class="stept" x="412" y="134">Sign + discard</text>
  <text class="steps" x="388" y="158">sign the artifact with</text>
  <text class="steps" x="388" y="174">the ephemeral key, then</text>
  <text class="steps" x="388" y="186" style="font-weight:700">throw the key away</text>

  <!-- step 4 -->
  <rect class="step" x="542" y="110" width="148" height="80" rx="8"/>
  <circle class="stepn" cx="562" cy="130" r="11"/>
  <text class="stepnt" x="562" y="134" text-anchor="middle">4</text>
  <text class="svc" x="580" y="134">REKOR (log)</text>
  <text class="steps" x="556" y="158">signature + cert into</text>
  <text class="steps" x="556" y="174">a public, append-only</text>
  <text class="steps" x="556" y="186" style="font-weight:700">transparency log</text>

  <!-- ============ CWE-321 NOTE ============ -->
  <rect class="note" x="30" y="206" width="660" height="52" rx="8"/>
  <rect class="noteacc" x="30" y="206" width="5" height="52" rx="2.5"/>
  <circle class="glyphC" cx="54" cy="232" r="9"/>
  <path class="tick" d="M49,232 l3.5,4 l6.5,-7.5"/>
  <text class="noteh" x="72" y="228">Nothing long-lived touches the disk</text>
  <text class="notel" x="72" y="247">There is no private key to steal, commit, or forget to rotate — that is how CWE-321 is avoided, not patched.</text>

  <!-- ============ VERIFY LANE ============ -->
  <text class="lane" x="30" y="298">VERIFY  ·  the deploy gate</text>
  <line class="rule" x1="30" y1="306" x2="690" y2="306"/>

  <!-- the gate box -->
  <rect class="step" x="30" y="322" width="206" height="118" rx="8"/>
  <text class="gate" x="44" y="350">cosign verify</text>
  <text class="line" x="44" y="372">checks the signature against</text>
  <text class="line" x="44" y="390">the expected identity</text>
  <text class="line" x="44" y="408">and the Rekor log —</text>
  <text class="line" x="44" y="426">before the image ships.</text>

  <!-- arrows to outcomes -->
  <path class="spine" d="M236,358 L286,358" marker-end="url(#kahb)"/>
  <path class="spine" d="M236,404 L286,404" marker-end="url(#kahb)"/>

  <!-- PASS outcome -->
  <rect class="pass" x="292" y="330" width="398" height="52" rx="7"/>
  <circle class="glyphC" cx="316" cy="356" r="10"/>
  <path class="tick" d="M311,356 l3.5,4 l6.5,-7.5"/>
  <text class="passh" x="336" y="352">Valid signature, identity matches</text>
  <text class="line" x="336" y="371">→ deploy allowed</text>

  <!-- FAIL outcome -->
  <rect class="fail" x="292" y="388" width="398" height="52" rx="7"/>
  <circle class="glyphA" cx="316" cy="414" r="10"/>
  <path class="cross" d="M312,410 l8,8 M320,410 l-8,8"/>
  <text class="failh" x="336" y="410">Unsigned or tampered image</text>
  <text class="line mono" x="336" y="429">→ no signatures found · gate blocks it</text>

  <!-- ============ CLOSING BANNER ============ -->
  <rect class="banner" x="30" y="456" width="660" height="34" rx="8"/>
  <text class="bant" x="48" y="478">You don't trust a key that could be stolen — you trust a logged identity that can't be forged quietly.</text>
</svg>
