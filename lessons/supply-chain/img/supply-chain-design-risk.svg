      .secnt  { fill:#0b1016; }
      .sech   { fill:#e5eef5; }
      .cap    { fill:#9aa3ad; }

      .barA   { fill:#4aa3dd; }
      .barB   { fill:#5b6670; }
      .baraccx{ fill:#ff7a3d; }
      .bart   { fill:#f3f4f6; }
      .bart10 { fill:#0b1016; }
      .bartb  { fill:#f3f4f6; }
      .barlbl { fill:#9aa3ad; }

      .atk    { fill:#241812; stroke:#ff7a3d; }
      .atkacc { fill:#ff7a3d; }
      .atkh   { fill:#ff7a3d; }
      .line   { fill:#c4ccd4; }

      .fan    { stroke:#ff7a3d; }
      .vic    { fill:#3a2417; stroke:#ff7a3d; }

      .glyphA { fill:#ff7a3d; }
