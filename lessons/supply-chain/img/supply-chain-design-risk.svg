<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 648" role="img" aria-label="Why dependencies have become a top design risk, in three facts. Fact one, the ratio: of everything you ship, only about ten percent is code you wrote; the other ninety percent is dependencies you installed, trusted, and never read. A stacked bar shows a small blue your-code segment at ten percent beside a large grey segment at about ninety percent of other people's code, so the ninety percent dominates the width. Fact two, the blast radius: a single poisoned package, published once, fans out to thousands of downstream projects and users who pulled it in transitively and never chose it. Three real cases prove it already happened — xz-utils in 2024, a backdoor planted in the liblzma dependency upstream; event-stream in 2018, a malicious dependency that stole crypto-wallet keys from the apps that depended on it; and SolarWinds in 2020, where a trojanized vendor update reached roughly eighteen thousand organizations. Fact three, the label: OWASP moved this risk up the list, from A06 in 2021, Vulnerable and Outdated Components, to A03 in 2025, Software Supply Chain Failures — a promotion from sixth to third place. The takeaway at the foot: you can write perfect code and still be owned through a dependency you never read.">
  <title>Most of your attack surface is other people's code</title>
  <style>
    .bg     { fill:#ffffff; }
    .title  { fill:#111827; font:700 19px system-ui,sans-serif; }
    .sub    { fill:#6b7280; font:400 12.5px system-ui,sans-serif; }

