    .barA   { fill:#017BC4; }
    .barB   { fill:#6b7280; }
    .baraccx{ fill:#E35205; }
    .bart   { fill:#ffffff; font:700 13px system-ui,sans-serif; }
    .bart10 { fill:#ffffff; font:700 13px system-ui,sans-serif; }
    .bartb  { fill:#ffffff; font:700 16px system-ui,sans-serif; }
    .barlbl { fill:#6b7280; font:700 10px system-ui,sans-serif; letter-spacing:0.5px; }

    .atk    { fill:#fff6f1; stroke:#E35205; stroke-width:1.8; }
    .atkacc { fill:#E35205; }
    .atkh   { fill:#b23f00; font:700 12.5px system-ui,sans-serif; }
    .line   { fill:#374151; font:400 11px system-ui,sans-serif; }

    .fan    { stroke:#E35205; stroke-width:1.4; fill:none; opacity:0.75; }
    .vic    { fill:#ffd9c2; stroke:#E35205; stroke-width:1.3; }

    .glyphA { fill:#E35205; }
    .bang   { fill:#ffffff; }

    .evh    { fill:#b23f00; font:700 9.5px system-ui,sans-serif; letter-spacing:0.6px; }

    .mut    { fill:#eef1f4; stroke:#9aa3ad; stroke-width:1.5; }
    .muth   { fill:#6b7280; font:700 11px system-ui,sans-serif; }
    .muts   { fill:#9aa3ad; font:400 10px system-ui,sans-serif; }
    .promo  { fill:#6b7280; font:700 9.5px system-ui,sans-serif; letter-spacing:0.5px; }
    .badge  { fill:#fff1e8; stroke:#E35205; stroke-width:2; }
    .badgeb { fill:#b23f00; font:800 18px system-ui,sans-serif; }
    .badget { fill:#b23f00; font:700 13px system-ui,sans-serif; }
    .conn   { stroke:#E35205; stroke-width:2.2; fill:none; }
    .ahb    { fill:#E35205; }

    .banner { fill:#fff1e8; stroke:#E35205; stroke-width:2; }
    .bant   { fill:#b23f00; font:700 15px system-ui,sans-serif; }
    .banl   { fill:#374151; font:400 12.5px system-ui,sans-serif; }

    @media (prefers-color-scheme: dark) {
      .bg     { fill:#0b1016; }
