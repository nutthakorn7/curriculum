<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 270" width="1000" height="270" role="img"
     aria-label="Left, passive attacker: Eve listens to the line between Alice and Bob but changes nothing, so encryption is the defence. Right, active attacker: Mallory sits between Alice and Bob and can change, replay or impersonate, so integrity and authenticity tools are needed.">
  <title>Passive versus active attackers</title>
  <style>
    .b  { fill: #fffdf9; stroke: #017BC4; stroke-width: 2 }
    .bo { fill: #fff6f0; stroke: #E35205; stroke-width: 2 }
    .bg { fill: #f3f4f6; stroke: #6b7280; stroke-width: 1.5 }
    .t  { font: 600 20px system-ui, sans-serif; fill: #16191d; text-anchor: middle }
    .ts { font: 500 15px system-ui, sans-serif; fill: #374151; text-anchor: middle }
    .tm { font: 500 16px ui-monospace, Menlo, monospace; fill: #16191d; text-anchor: middle }
    .tb { font: 700 16px system-ui, sans-serif; fill: #017BC4; text-anchor: middle }
    .to { font: 700 16px system-ui, sans-serif; fill: #E35205; text-anchor: middle }
    .h  { font: 700 22px system-ui, sans-serif; fill: #017BC4; text-anchor: middle }
    .a  { stroke: #16191d; stroke-width: 2; fill: none; marker-end: url(#ar) }
    .ao { stroke: #E35205; stroke-width: 2.5; fill: none; marker-end: url(#aro) }
    .d  { stroke: #6b7280; stroke-width: 2; fill: none; stroke-dasharray: 6 5 }
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#16191d"/></marker>
    <marker id="aro" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#E35205"/></marker>
  </defs>
  <text class="h" x="250" y="34">Passive — listens only</text>
  <rect class="b" x="30" y="70" width="120" height="60" rx="10"/><text class="t" x="90" y="107">Alice</text>
  <rect class="b" x="350" y="70" width="120" height="60" rx="10"/><text class="t" x="410" y="107">Bob</text>
  <path class="a" d="M155,100 H345"/>
  <path class="d" d="M250,100 V170"/>
  <rect class="bg" x="190" y="170" width="120" height="56" rx="10"/><text class="t" x="250" y="205">Eve 👂</text>
  <text class="ts" x="250" y="250">reads, changes nothing → need encryption</text>
  <line x1="500" y1="20" x2="500" y2="260" class="d"/>
  <text class="h" x="750" y="34">Active — sits in the middle</text>
  <rect class="b" x="530" y="70" width="120" height="60" rx="10"/><text class="t" x="590" y="107">Alice</text>
  <rect class="bo" x="690" y="70" width="120" height="60" rx="10"/><text class="t" x="750" y="107">Mallory</text>
  <rect class="b" x="850" y="70" width="120" height="60" rx="10"/><text class="t" x="910" y="107">Bob</text>
  <path class="ao" d="M655,100 H685"/><path class="ao" d="M815,100 H845"/>
  <text class="ts" x="750" y="170">changes · replays · pretends to be Bob</text>
  <text class="ts" x="750" y="250">→ need MAC / signature / AEAD / certificates</text>
</svg>
