<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 430" width="760" height="327" role="img" aria-label="Toy example with secret s equal to 2. The sender takes the data 3, 1, 4 and works through it: (0 plus 3) times 2 is 6, (6 plus 1) times 2 is 14, (14 plus 4) times 2 is 36, so the tag is 36. Eve changes the 3 into a 5. The receiver works through 5, 1, 4 the same way: 10, 22, 52. The result 52 is not the tag 36 that came with the data, so the message is rejected. Eve does not know s, so she cannot tell which tag would match her changed data.">
  <title>A toy tag: mix every number with a secret</title>
  <style>
    .b  { fill: #fffdf9; stroke: #017BC4; stroke-width: 2 }
    .bo { fill: #fff6f0; stroke: #E35205; stroke-width: 2 }
    .bg { fill: #f3f4f6; stroke: #6b7280; stroke-width: 1.5 }
    .bgr{ fill: #eef8f0; stroke: #2f855a; stroke-width: 2 }
    .br { fill: #fdeeee; stroke: #c53030; stroke-width: 2 }
    .t  { font: 700 18px system-ui, sans-serif; fill: #16191d; text-anchor: middle }
    .ts { font: 500 14px system-ui, sans-serif; fill: #374151; text-anchor: middle }
    .tm { font: 600 14px ui-monospace, Menlo, monospace; fill: #16191d; text-anchor: middle }
    .tb { font: 700 16px system-ui, sans-serif; fill: #017BC4; text-anchor: middle }
    .to { font: 700 16px system-ui, sans-serif; fill: #E35205; text-anchor: middle }
    .tg { font: 700 16px system-ui, sans-serif; fill: #2f855a; text-anchor: middle }
    .tr { font: 700 16px system-ui, sans-serif; fill: #c53030; text-anchor: middle }
    .a  { stroke: #16191d; stroke-width: 1.8; fill: none; marker-end: url(#ar) }
    .ao { stroke: #E35205; stroke-width: 2.2; fill: none; marker-end: url(#aro) }
    .ab { stroke: #017BC4; stroke-width: 2.2; fill: none; marker-end: url(#arb) }
    .ad { stroke: #E35205; stroke-width: 2.2; fill: none; stroke-dasharray: 6 5; marker-end: url(#aro) }
    @media (prefers-color-scheme: dark) {
      .b  { fill: #151a20; stroke: #4aa3dd } .bo { fill: #2a1c14; stroke: #ff7a3d }
      .bg { fill: #22262b; stroke: #9aa3ad } .bgr { fill: #14251a; stroke: #5fbf8a } .br { fill: #2a1515; stroke: #f08080 }
      .t, .tm { fill: #e6e8ea } .ts { fill: #b8c0c8 }
      .tb { fill: #4aa3dd } .to { fill: #ff7a3d } .tg { fill: #5fbf8a } .tr { fill: #f08080 }
      .a  { stroke: #c9ced3 } .ao, .ad { stroke: #ff7a3d } .ab { stroke: #4aa3dd }
      [fill="#16191d"] { fill: #c9ced3 }
    }
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#16191d"/></marker>
    <marker id="aro" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#E35205"/></marker>
    <marker id="arb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#017BC4"/></marker>
  </defs>
  <text class="t" x="500" y="28">A toy tag: mix every number with the secret s = 2</text>
  <text class="tg" x="100" y="92">Sender</text>
  <text class="ts" x="100" y="114">knows s = 2</text>
  <rect class="b" x="200" y="65" width="160" height="72" rx="8"/>
  <text class="tb" x="280.0" y="93.0">data</text>
  <text class="ts" x="280.0" y="119.0">3, 1, 4</text>
  <rect class="b" x="410" y="65" width="160" height="72" rx="8"/>
  <text class="tm" x="490.0" y="93.0">(0 + 3) × 2</text>
  <text class="tm" x="490.0" y="119.0">= 6</text>
  <path class="ab" d="M360,101 H406"/>
  <rect class="b" x="620" y="65" width="160" height="72" rx="8"/>
  <text class="tm" x="700.0" y="93.0">(6 + 1) × 2</text>
  <text class="tm" x="700.0" y="119.0">= 14</text>
  <path class="ab" d="M570,101 H616"/>
  <rect class="bgr" x="830" y="65" width="160" height="72" rx="8"/>
  <text class="tm" x="910.0" y="93.0">(14 + 4) × 2</text>
  <text class="tm" x="910.0" y="119.0">= 36 = tag</text>
  <path class="ab" d="M780,101 H826"/>
  <text class="ts" x="500" y="172">tag 36 travels with the data</text>
  <text class="tr" x="100" y="252">Receiver</text>
  <text class="ts" x="100" y="274">after Eve changed</text>
  <text class="ts" x="100" y="294">3 into 5</text>
  <rect class="br" x="200" y="225" width="160" height="72" rx="8"/>
  <text class="tr" x="280.0" y="253.0">Eve's data</text>
  <text class="ts" x="280.0" y="279.0">5, 1, 4</text>
  <rect class="bo" x="410" y="225" width="160" height="72" rx="8"/>
  <text class="tm" x="490.0" y="253.0">(0 + 5) × 2</text>
  <text class="tm" x="490.0" y="279.0">= 10</text>
  <path class="ao" d="M360,261 H406"/>
  <rect class="bo" x="620" y="225" width="160" height="72" rx="8"/>
  <text class="tm" x="700.0" y="253.0">(10 + 1) × 2</text>
  <text class="tm" x="700.0" y="279.0">= 22</text>
  <path class="ao" d="M570,261 H616"/>
  <rect class="br" x="830" y="225" width="160" height="72" rx="8"/>
  <text class="tm" x="910.0" y="253.0">(22 + 4) × 2</text>
  <text class="tm" x="910.0" y="279.0">= 52</text>
  <path class="ao" d="M780,261 H826"/>
  <rect class="br" x="250" y="335" width="500" height="50" rx="8"/>
  <text class="tr" x="500.0" y="365.0">52 ≠ 36  →  tag does not match  →  reject (403)</text>
  <text class="ts" x="500" y="412">Eve does not know s, so she cannot tell which tag would match 5, 1, 4</text>
</svg>
