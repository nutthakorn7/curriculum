<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 392" width="760" height="298" role="img" aria-label="In CBC the first block is mixed with a random start value called the IV, then locked with AES. The locked result of each block is mixed into the next block before that block is locked. So changing a block changes the same spot in the next block, without needing the key.">
  <title>CBC chains the blocks together</title>
  <style>
    .b  { fill: #fffdf9; stroke: #017BC4; stroke-width: 2 }
    .bo { fill: #fff6f0; stroke: #E35205; stroke-width: 2 }
    .bg { fill: #f3f4f6; stroke: #6b7280; stroke-width: 1.5 }
    .bgr{ fill: #eef8f0; stroke: #2f855a; stroke-width: 2 }
    .t  { font: 700 18px system-ui, sans-serif; fill: #16191d; text-anchor: middle }
    .ts { font: 500 14px system-ui, sans-serif; fill: #374151; text-anchor: middle }
    .tm { font: 600 14px ui-monospace, Menlo, monospace; fill: #16191d; text-anchor: middle }
    .tb { font: 700 16px system-ui, sans-serif; fill: #017BC4; text-anchor: middle }
    .to { font: 700 16px system-ui, sans-serif; fill: #E35205; text-anchor: middle }
    .tg { font: 700 16px system-ui, sans-serif; fill: #2f855a; text-anchor: middle }
    .a  { stroke: #16191d; stroke-width: 1.8; fill: none; marker-end: url(#ar) }
    .ao { stroke: #E35205; stroke-width: 2.2; fill: none; marker-end: url(#aro) }
    @media (prefers-color-scheme: dark) {
      .b  { fill: #151a20; stroke: #4aa3dd } .bo { fill: #2a1c14; stroke: #ff7a3d }
      .bg { fill: #22262b; stroke: #9aa3ad } .bgr { fill: #14251a; stroke: #5fbf8a }
      .t, .tm { fill: #e6e8ea } .ts { fill: #b8c0c8 }
      .tb { fill: #4aa3dd } .to, .q { fill: #ff7a3d } .tg { fill: #5fbf8a }
      .a  { stroke: #c9ced3 } .ao { stroke: #ff7a3d }
      [fill="#16191d"] { fill: #c9ced3 }
    }
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#16191d"/></marker>
    <marker id="aro" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#E35205"/></marker>
  </defs>
  <text class="t" x="500" y="30">CBC: mix each block with the block before, then lock it</text>
  <text class="ts" x="500" y="52">The result of one block is fed into the next. That is the "chain".</text>
  <rect class="bg" x="60" y="75" width="220" height="44" rx="8"/><text class="tm" x="170" y="103">block 1</text>
  <path class="a" d="M170,123 V150"/>
  <circle cx="170" cy="172" r="22" class="bo"/><text class="to" x="170" y="178">mix</text>
  <path class="a" d="M170,196 V222"/>
  <rect class="b" x="60" y="226" width="220" height="44" rx="8"/><text class="tb" x="170" y="254">AES lock + key</text>
  <path class="a" d="M170,274 V298"/>
  <rect class="bo" x="60" y="302" width="220" height="44" rx="8"/><text class="tm" x="170" y="330">ciphertext 1</text>
  <rect class="bg" x="380" y="75" width="220" height="44" rx="8"/><text class="tm" x="490" y="103">block 2</text>
  <path class="a" d="M490,123 V150"/>
  <circle cx="490" cy="172" r="22" class="bo"/><text class="to" x="490" y="178">mix</text>
  <path class="a" d="M490,196 V222"/>
  <rect class="b" x="380" y="226" width="220" height="44" rx="8"/><text class="tb" x="490" y="254">AES lock + key</text>
  <path class="a" d="M490,274 V298"/>
  <rect class="bo" x="380" y="302" width="220" height="44" rx="8"/><text class="tm" x="490" y="330">ciphertext 2</text>
  <rect class="bg" x="700" y="75" width="220" height="44" rx="8"/><text class="tm" x="810" y="103">block 3</text>
  <path class="a" d="M810,123 V150"/>
  <circle cx="810" cy="172" r="22" class="bo"/><text class="to" x="810" y="178">mix</text>
  <path class="a" d="M810,196 V222"/>
  <rect class="b" x="700" y="226" width="220" height="44" rx="8"/><text class="tb" x="810" y="254">AES lock + key</text>
  <path class="a" d="M810,274 V298"/>
  <rect class="bo" x="700" y="302" width="220" height="44" rx="8"/><text class="tm" x="810" y="330">ciphertext 3</text>
  <rect class="bgr" x="10" y="150" width="46" height="44" rx="8"/><text class="tg" x="33" y="178">IV</text>
  <path class="ao" d="M56,172 H144"/>
  <text class="ts" x="33" y="212">random</text><text class="ts" x="33" y="228">start</text>
  <path class="ao" d="M280,324 H330 V172 H464"/>
  <path class="ao" d="M600,324 H650 V172 H784"/>
  <text class="to" x="500" y="376">Change the block before → the same spot changes in the next block (no key needed)</text>
</svg>
