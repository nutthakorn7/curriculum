services:
  vulnerable:
    build: .
    command: python vulnerable_app.py
    environment:
      - FLAG_S3SITE=${FLAG_S3SITE:-FLAG{public_putobject_defaces_your_website}}
    ports:
      # 127.0.0.1 = this machine only. Lab apps are deliberately vulnerable; keep them off the classroom network.
      - "127.0.0.1:8105:5000"

  fixed:
    build: .
    command: python fixed_app.py
    environment:
      - FLAG_S3SITE=${FLAG_S3SITE:-FLAG{public_putobject_defaces_your_website}}
    ports:
      # 127.0.0.1 = this machine only. Lab apps are deliberately vulnerable; keep them off the classroom network.
      - "127.0.0.1:8106:5000"
