services:
  vulnerable:
    build: .
    command: python vulnerable_app.py
    environment:
      - FLAG_NACL=${FLAG_NACL:-FLAG{low_numbered_allow_shadows_the_deny}}
    ports:
      # 127.0.0.1 = this machine only. Lab apps are deliberately vulnerable; keep them off the classroom network.
      - "127.0.0.1:8113:5000"

  fixed:
    build: .
    command: python fixed_app.py
    environment:
      - FLAG_NACL=${FLAG_NACL:-FLAG{low_numbered_allow_shadows_the_deny}}
    ports:
      # 127.0.0.1 = this machine only. Lab apps are deliberately vulnerable; keep them off the classroom network.
      - "127.0.0.1:8114:5000"
