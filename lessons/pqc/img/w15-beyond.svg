  <rect class="b" x="618" y="142" width="28" height="24" rx="6"/>
  <rect class="b" x="697" y="142" width="28" height="24" rx="6"/>
  <rect class="b" x="775" y="142" width="28" height="24" rx="6"/>
  <rect class="b" x="854" y="142" width="28" height="24" rx="6"/>
  <rect class="b" x="578" y="190" width="30" height="30" rx="5"/>
  <text class="ts" x="593" y="211">0</text>
  <rect class="b" x="623" y="190" width="30" height="30" rx="5"/>
  <text class="ts" x="638" y="211">1</text>
  <rect class="b" x="668" y="190" width="30" height="30" rx="5"/>
  <text class="ts" x="683" y="211">2</text>
  <rect class="b" x="713" y="190" width="30" height="30" rx="5"/>
  <text class="ts" x="728" y="211">3</text>
  <rect class="b" x="758" y="190" width="30" height="30" rx="5"/>
  <text class="ts" x="773" y="211">4</text>
  <rect class="bo" x="803" y="190" width="30" height="30" rx="5"/>
  <text class="ts" x="818" y="211">5</text>
  <rect class="b" x="848" y="190" width="30" height="30" rx="5"/>
  <text class="ts" x="863" y="211">6</text>
  <rect class="b" x="893" y="190" width="30" height="30" rx="5"/>
  <text class="ts" x="908" y="211">7</text>
  <text class="tb" x="250" y="52">Stateful: XMSS, LMS</text>
  <text class="tb" x="750" y="52">Stateless: SPHINCS+ (SLH-DSA)</text>
  <text class="ts" x="250" y="250">leaves used in order: 0, 1, 2, then 3</text>
  <text class="ts" x="250" y="272">the signer must save the counter</text>
  <text class="ts" x="750" y="250">a huge tree, a pseudorandom leaf each time</text>
  <text class="ts" x="750" y="272">reuse is negligible</text>
  <text class="tr" x="250" y="308">risk: a VM snapshot rollback reuses a leaf</text>
  <text class="tg" x="750" y="308">no state to lose</text>
  <text class="t" x="500" y="345">Crypto-agility: be able to swap algorithms without a rewrite</text>
</svg>
