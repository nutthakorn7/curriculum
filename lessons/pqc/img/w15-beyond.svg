  <rect class="bg" x="78" y="190" width="30" height="30" rx="5"/>
  <text class="ts" x="93" y="211">0</text>
  <rect class="bg" x="123" y="190" width="30" height="30" rx="5"/>
  <text class="ts" x="138" y="211">1</text>
  <rect class="bg" x="168" y="190" width="30" height="30" rx="5"/>
  <text class="ts" x="183" y="211">2</text>
  <rect class="bo" x="213" y="190" width="30" height="30" rx="5"/>
  <text class="ts" x="228" y="211">3</text>
  <rect class="b" x="258" y="190" width="30" height="30" rx="5"/>
  <text class="ts" x="273" y="211">4</text>
  <rect class="b" x="303" y="190" width="30" height="30" rx="5"/>
