  <rect class="b" x="348" y="190" width="30" height="30" rx="5"/>
  <text class="ts" x="363" y="211">6</text>
  <rect class="b" x="393" y="190" width="30" height="30" rx="5"/>
  <text class="ts" x="408" y="211">7</text>
  <path d="M750,82 L671,118 M750,82 L829,118" stroke="#8a929b" stroke-width="1.6" fill="none"/>
  <path d="M671,118 L632,154 M671,118 L710,154" stroke="#8a929b" stroke-width="1.6" fill="none"/>
  <path d="M829,118 L790,154 M829,118 L868,154" stroke="#8a929b" stroke-width="1.6" fill="none"/>
