<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 330" width="760" height="251" role="img" aria-label="Four post-quantum families as cards. Lattice-based gives ML-KEM, a key agreement, and ML-DSA, a signature. Hash-based gives Lamport, XMSS and SPHINCS plus, and is the focus this week. Code-based gives Classic McEliece. Multivariate gives UOV, a research candidate and not a NIST standard. A KEM agrees a shared key and a signature vouches for data.">
  <title>Four PQC families</title>
  <style>
    .b  { fill: #fffdf9; stroke: #017BC4; stroke-width: 2 }
    .bo { fill: #fff6f0; stroke: #E35205; stroke-width: 2 }
    .bg { fill: #f3f4f6; stroke: #6b7280; stroke-width: 1.5 }
    .bgr{ fill: #eef8f0; stroke: #2f855a; stroke-width: 2 }
    .br { fill: #fdeeee; stroke: #c53030; stroke-width: 2 }
    .t  { font: 700 18px system-ui, sans-serif; fill: #16191d; text-anchor: middle }
    .ts { font: 500 14px system-ui, sans-serif; fill: #374151; text-anchor: middle }
    .tm { font: 600 14px ui-monospace, Menlo, monospace; fill: #16191d; text-anchor: middle }
    .tb { font: 700 16px system-ui, sans-serif; fill: #017BC4; text-anchor: middle }
    .to { font: 700 16px system-ui, sans-serif; fill: #E35205; text-anchor: middle }
    .tg { font: 700 16px system-ui, sans-serif; fill: #2f855a; text-anchor: middle }
    .tr { font: 700 16px system-ui, sans-serif; fill: #c53030; text-anchor: middle }
    .a  { stroke: #16191d; stroke-width: 1.8; fill: none; marker-end: url(#ar) }
    .ao { stroke: #E35205; stroke-width: 2.2; fill: none; marker-end: url(#aro) }
    .ab { stroke: #017BC4; stroke-width: 2.2; fill: none; marker-end: url(#arb) }
    .ad { stroke: #E35205; stroke-width: 2.2; fill: none; stroke-dasharray: 6 5; marker-end: url(#aro) }
    @media (prefers-color-scheme: dark) {
      .b  { fill: #151a20; stroke: #4aa3dd } .bo { fill: #2a1c14; stroke: #ff7a3d }
      .bg { fill: #22262b; stroke: #9aa3ad } .bgr { fill: #14251a; stroke: #5fbf8a } .br { fill: #2a1515; stroke: #f08080 }
      .t, .tm { fill: #e6e8ea } .ts { fill: #b8c0c8 }
      .tb { fill: #4aa3dd } .to { fill: #ff7a3d } .tg { fill: #5fbf8a } .tr { fill: #f08080 }
      .a  { stroke: #c9ced3 } .ao, .ad { stroke: #ff7a3d } .ab { stroke: #4aa3dd }
      [fill="#16191d"] { fill: #c9ced3 }
    }
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#16191d"/></marker>
    <marker id="aro" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#E35205"/></marker>
    <marker id="arb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#017BC4"/></marker>
  </defs>
  <text class="t" x="500" y="28">Four ways to build crypto that quantum computers do not break</text>
  <rect class="b" x="15" y="55" width="220" height="170" rx="12"/>
  <text class="tb" x="125" y="92">Lattice</text>
  <text class="ts" x="125" y="128">ML-KEM (a KEM)</text>
  <text class="ts" x="125" y="152">ML-DSA (a signature)</text>
  <text class="ts" x="125" y="195">FIPS 203, 204</text>
  <rect class="bo" x="265" y="55" width="220" height="170" rx="12"/>
  <text class="to" x="375" y="92">Hash-based</text>
  <text class="ts" x="375" y="128">Lamport, XMSS</text>
  <text class="ts" x="375" y="152">SPHINCS+ (SLH-DSA)</text>
  <text class="ts" x="375" y="195">FIPS 205: this week</text>
  <rect class="b" x="515" y="55" width="220" height="170" rx="12"/>
  <text class="tb" x="625" y="92">Code-based</text>
  <text class="ts" x="625" y="128">Classic McEliece</text>
  <text class="ts" x="625" y="152"></text>
  <text class="ts" x="625" y="195"> </text>
  <rect class="bg" x="765" y="55" width="220" height="170" rx="12"/>
  <text class="t" x="875" y="92">Multivariate</text>
  <text class="ts" x="875" y="128">UOV</text>
  <text class="ts" x="875" y="152">research candidate</text>
  <text class="ts" x="875" y="195">not a NIST standard</text>
  <rect class="bg" x="15" y="255" width="470" height="60" rx="10"/>
  <text class="t" x="250" y="280">KEM = agree a shared key</text>
  <text class="ts" x="250" y="302">used in the TLS handshake</text>
  <rect class="bg" x="515" y="255" width="470" height="60" rx="10"/>
  <text class="t" x="750" y="280">Signature = vouch for data</text>
  <text class="ts" x="750" y="302">used for data and certificates</text>
</svg>
