<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" role="img"
     aria-label="Two zones, top to bottom. Top: the server holds one Lamport keypair — for a representative bit position, two locked secret preimages are each hashed into a published public-key pair, repeated identically for all thirty-two bit positions; the sign endpoint refuses only the one reserved target message directly. Middle: the same reused key answers two sign requests, message zero and its bitwise complement all-ones, revealing every zero-preimage and every one-preimage with nothing refused. Bottom: the attacker, now holding the complete private key, picks the matching preimage for each bit of the target message it was never allowed to sign, assembles a forged signature, and submits it to the admin endpoint, which accepts it because verification only checks the signature against the published public key, never who asked for it.">
  <title>Lamport key reuse: two signatures are the whole private key</title>
  <style>
    .z    { fill: none; stroke: #b9b4aa; stroke-dasharray: 6 4 }
    .zl   { font: 600 11px system-ui, sans-serif; fill: #6b7280;
            letter-spacing: .06em; text-transform: uppercase }
    .b    { fill: #fffdf9; stroke: #017BC4; stroke-width: 1.5; rx: 6 }
    .blocked { fill: #f0efe9; stroke: #6b7280; stroke-width: 1.5; stroke-dasharray: 3 3; rx: 6 }
    .battack { fill: #fff6f0; stroke: #E35205; stroke-width: 1.5; rx: 6 }
    .bforged { fill: #fff6f0; stroke: #E35205; stroke-width: 2.5; rx: 8 }
    .bl   { font: 600 13px system-ui, sans-serif; fill: #16191d; text-anchor: middle }
    .bls  { font: 600 11px system-ui, sans-serif; fill: #16191d; text-anchor: middle }
    .comp { font: 600 11px system-ui, sans-serif; fill: #6b7280; text-anchor: middle }
    .e    { stroke: #6b7280; stroke-width: 1.6; marker-end: url(#a) }
    .eattack { stroke: #E35205; stroke-width: 1.8; marker-end: url(#b) }
    .el   { font: 11px system-ui, sans-serif; fill: #6b7280; text-anchor: middle }
    .ann  { font: 11px system-ui, sans-serif; fill: #6b7280; text-anchor: start }
    .x    { font: 700 12px system-ui, sans-serif; fill: #E35205; text-anchor: middle }
    .ok   { font: 700 12px system-ui, sans-serif; fill: #017BC4; text-anchor: middle }
    .arrow{ fill: #6b7280 }
    .arrowbad { fill: #E35205 }
    .lock { font-size: 15px; text-anchor: middle }
    @media (prefers-color-scheme: dark) {
      .z { stroke: #3a4149 } .zl { fill: #9aa3ad }
      .b { fill: #151a20; stroke: #4aa3dd } .bl, .bls { fill: #e6e8ea }
      .blocked { fill: #22262b; stroke: #9aa3ad }
      .battack, .bforged { fill: #2a1c14; stroke: #ff7a3d }
      .e, .comp, .el, .ann { stroke: #9aa3ad } .comp, .el, .ann { fill: #9aa3ad }
      .eattack { stroke: #ff7a3d } .arrow { fill: #9aa3ad } .arrowbad { fill: #ff7a3d }
      .x { fill: #ff7a3d } .ok { fill: #4aa3dd }
    }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7"
            markerHeight="7" orient="auto"><path class="arrow" d="M0 0 L8 4 L0 8 z"/></marker>
    <marker id="b" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7"
            markerHeight="7" orient="auto"><path class="arrowbad" d="M0 0 L8 4 L0 8 z"/></marker>
  </defs>

  <rect class="z" x="10" y="10" width="980" height="180" rx="8"/>
  <text class="zl" x="18" y="30">The server — one Lamport keypair, generated once, reused on every /sign call</text>

  <rect class="blocked" x="50" y="55" width="170" height="48"/>
  <text class="lock" x="135" y="72">&#128274;</text>
  <text class="bls" x="135" y="92">sk[i][0]</text>

  <rect class="blocked" x="50" y="113" width="170" height="48"/>
  <text class="lock" x="135" y="130">&#128274;</text>
  <text class="bls" x="135" y="150">sk[i][1]</text>

  <path class="e" d="M220 79 L290 79"/>
  <text class="comp" x="255" y="71">H(&#183;)</text>
  <path class="e" d="M220 137 L290 137"/>
  <text class="comp" x="255" y="129">H(&#183;)</text>

  <rect class="b" x="290" y="55" width="190" height="48"/>
  <text class="bls" x="385" y="83">pk[i][0]</text>
  <rect class="b" x="290" y="113" width="190" height="48"/>
  <text class="bls" x="385" y="141">pk[i][1]</text>

  <text class="ann" x="540" y="79">&#8594; repeats identically for all 32 bit positions (i = 0&#8230;31)</text>
  <text class="ann" x="540" y="137">&#8594; pk[i] is published at GET /pubkey &#8212; safe; sk[i] is not</text>

  <text class="ann" x="50" y="178">POST /sign refuses only the ONE reserved target message directly &#8212; everything else, it happily (re-)signs with this SAME key.</text>

  <path class="eattack" d="M135 161 L135 280"/>
  <text class="x" x="500" y="203">Two /sign calls, same key: M = 0x00000000, then ~M = 0xFFFFFFFF</text>
  <text class="el" x="500" y="219">&#8594; every sk[i][0] AND sk[i][1] revealed &#8212; the server refused nothing</text>

  <rect class="z" x="10" y="230" width="980" height="260" rx="8"/>
  <text class="zl" x="18" y="250">The attacker — holds both preimages at every bit position, including the message it was never asked to sign</text>

  <rect class="battack" x="50" y="280" width="230" height="76"/>
  <text class="bl" x="165" y="312">full private key recovered</text>
  <text class="bls" x="165" y="332">sk[i][0] &amp; sk[i][1] &#8212; every bit i</text>

  <path class="eattack" d="M280 318 L340 318"/>
  <text class="comp" x="310" y="308">forge</text>

  <rect class="battack" x="340" y="280" width="230" height="76"/>
  <text class="bl" x="455" y="312">forge signature on target</text>
  <text class="bls" x="455" y="332">sig[i] = sk[i][ target_bit[i] ]</text>

  <path class="eattack" d="M570 318 L630 318"/>
  <text class="comp" x="600" y="308">/admin</text>

  <rect class="bforged" x="630" y="270" width="230" height="96"/>
  <text class="bl" x="745" y="294">forged signature</text>
  <text class="bls" x="745" y="312">verifies under the SAME</text>
  <text class="bls" x="745" y="330">published pk</text>
  <text class="x" x="745" y="350">= ACCEPTED, flag released</text>

  <text class="ok" x="500" y="430">Same verify() the server always runs, same published key — minus the one message the attacker was never handed directly.</text>
</svg>
