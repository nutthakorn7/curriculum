services:
  injection-lab:
    build: .
    working_dir: /lab
    ports:
      - "8080:5000"
    volumes:
      - ./:/lab
    # PRACTICE build: with no .env the app serves public demo flags (FLAG{..._demo}).
    # Graded flags come only from your hosted CTFd instance, never from this local run.
    environment:
      - FLAG_SQLI
      - FLAG_CMDI
    command: >
      bash -c "pip install --no-cache-dir flask &&
               echo '--- vulnerable app on :8080 (use solution_app.py for the fixed version) ---' &&
               python vulnerable_app.py"
