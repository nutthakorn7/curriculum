services:
  vulnerable:
    build: .
    command: python vulnerable_app.py
    ports:
      # 127.0.0.1 = this machine only. Lab apps are deliberately vulnerable; keep them off the classroom network.
      - "127.0.0.1:8111:5000"

  fixed:
    build: .
    command: python fixed_app.py
    environment:
      - FLAG_MONITOR=${FLAG_MONITOR:-FLAG{aggregation_key_must_match_the_threat_model}}
    ports:
      # 127.0.0.1 = this machine only. Lab apps are deliberately vulnerable; keep them off the classroom network.
      - "127.0.0.1:8112:5000"
