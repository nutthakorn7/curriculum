<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 330" width="1000" height="330" role="img"
     aria-label="A 34-character message is cut into 16-byte blocks. The last block holds only two characters, so 14 padding bytes are added, each with the value 14 (0e), to fill it. After decrypting, the server checks the padding: the last byte says how many padding bytes there are and they must all have that value. Valid padding gives 200 ok, invalid padding gives 403 bad padding.">
  <title>Padding fills the last block, and the server checks it</title>
  <style>
    .b  { fill: #fffdf9; stroke: #017BC4; stroke-width: 2 }
    .bo { fill: #fff6f0; stroke: #E35205; stroke-width: 2 }
    .bg { fill: #f3f4f6; stroke: #6b7280; stroke-width: 1.5 }
    .t  { font: 600 16px system-ui, sans-serif; fill: #16191d; text-anchor: middle }
    .ts { font: 500 13px system-ui, sans-serif; fill: #374151; text-anchor: middle }
    .tl { font: 600 14px system-ui, sans-serif; fill: #374151; text-anchor: start }
    .tm { font: 600 13px ui-monospace, Menlo, monospace; fill: #16191d; text-anchor: middle }
    .tb { font: 700 15px system-ui, sans-serif; fill: #017BC4; text-anchor: middle }
    .to { font: 700 15px system-ui, sans-serif; fill: #E35205; text-anchor: middle }
    .a  { stroke: #16191d; stroke-width: 1.8; fill: none; marker-end: url(#ar) }
    @media (prefers-color-scheme: dark) {
      .b  { fill: #151a20; stroke: #4aa3dd } .bo { fill: #2a1c14; stroke: #ff7a3d }
      .bg { fill: #22262b; stroke: #9aa3ad }
      .t, .tm { fill: #e6e8ea } .ts, .tl { fill: #b8c0c8 }
      .tb { fill: #4aa3dd } .to { fill: #ff7a3d }
      .a  { stroke: #c9ced3 }
      [fill="#16191d"] { fill: #c9ced3 }
    }
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#16191d"/></marker>
  </defs>

  <text class="tl" x="20" y="30">Message: msg:FLAG{padding_oracle_leaks_all}  (34 characters = 34 bytes)</text>
  <rect class="bg" x="20" y="48" width="300" height="56" rx="8"/><text class="ts" x="170" y="68">block 1 (16 bytes)</text><text class="tm" x="170" y="92">msg:FLAG{padding</text>
  <rect class="bg" x="330" y="48" width="300" height="56" rx="8"/><text class="ts" x="480" y="68">block 2 (16 bytes)</text><text class="tm" x="480" y="92">_oracle_leaks_al</text>
  <rect class="bg" x="640" y="48" width="80" height="56" rx="8"/><text class="ts" x="680" y="68">block 3</text><text class="tm" x="680" y="92">l}</text>
  <rect class="bo" x="728" y="48" width="252" height="56" rx="8"/><text class="to" x="854" y="70">padding: 14 bytes</text><text class="tm" x="854" y="92">0e 0e 0e … (each = 14)</text>
  <text class="ts" x="500" y="136">AES works on whole 16-byte blocks, so the end of the message is filled up with padding.</text>

  <path class="a" d="M500,150 V180"/>
  <rect class="b" x="250" y="185" width="500" height="56" rx="8"/>
  <text class="tb" x="500" y="209">After decrypting, the server checks the padding</text>
  <text class="ts" x="500" y="229">last byte = how many padding bytes, and they must all have that value</text>

  <path class="a" d="M400,246 L270,278"/>
  <path class="a" d="M600,246 L730,278"/>
  <rect class="b" x="40" y="280" width="420" height="40" rx="8"/><text class="tb" x="250" y="306">padding valid → 200 ok</text>
  <rect class="bo" x="540" y="280" width="420" height="40" rx="8"/><text class="to" x="750" y="306">padding invalid → 403 bad padding</text>
</svg>
