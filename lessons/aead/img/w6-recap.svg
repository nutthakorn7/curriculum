<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 330" width="760" height="251" role="img" aria-label="Week 3: a MAC checks a message was not changed. Week 4: CBC has no check so a token can be changed; GCM adds a tag. Week 5: key exchange has no check on who answers, so a tag is added to each public value. Week 6: a check that talks too much leaks through its answers.">
  <title>A good primitive and a missing check</title>
  <style>
    .b  { fill: #fffdf9; stroke: #017BC4; stroke-width: 2 }
    .bo { fill: #fff6f0; stroke: #E35205; stroke-width: 2 }
    .bg { fill: #f3f4f6; stroke: #6b7280; stroke-width: 1.5 }
    .bgr{ fill: #eef8f0; stroke: #2f855a; stroke-width: 2 }
    .br { fill: #fdeeee; stroke: #c53030; stroke-width: 2 }
    .t  { font: 700 18px system-ui, sans-serif; fill: #16191d; text-anchor: middle }
    .ts { font: 500 14px system-ui, sans-serif; fill: #374151; text-anchor: middle }
    .tm { font: 600 14px ui-monospace, Menlo, monospace; fill: #16191d; text-anchor: middle }
    .tb { font: 700 16px system-ui, sans-serif; fill: #017BC4; text-anchor: middle }
    .to { font: 700 16px system-ui, sans-serif; fill: #E35205; text-anchor: middle }
    .tg { font: 700 16px system-ui, sans-serif; fill: #2f855a; text-anchor: middle }
    .tr { font: 700 16px system-ui, sans-serif; fill: #c53030; text-anchor: middle }
    .a  { stroke: #16191d; stroke-width: 1.8; fill: none; marker-end: url(#ar) }
    .ao { stroke: #E35205; stroke-width: 2.2; fill: none; marker-end: url(#aro) }
    .ab { stroke: #017BC4; stroke-width: 2.2; fill: none; marker-end: url(#arb) }
    .ad { stroke: #E35205; stroke-width: 2.2; fill: none; stroke-dasharray: 6 5; marker-end: url(#aro) }
    @media (prefers-color-scheme: dark) {
      .b  { fill: #151a20; stroke: #4aa3dd } .bo { fill: #2a1c14; stroke: #ff7a3d }
      .bg { fill: #22262b; stroke: #9aa3ad } .bgr { fill: #14251a; stroke: #5fbf8a } .br { fill: #2a1515; stroke: #f08080 }
      .t, .tm { fill: #e6e8ea } .ts { fill: #b8c0c8 }
      .tb { fill: #4aa3dd } .to { fill: #ff7a3d } .tg { fill: #5fbf8a } .tr { fill: #f08080 }
      .a  { stroke: #c9ced3 } .ao, .ad { stroke: #ff7a3d } .ab { stroke: #4aa3dd }
      [fill="#16191d"] { fill: #c9ced3 }
    }
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#16191d"/></marker>
    <marker id="aro" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#E35205"/></marker>
    <marker id="arb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#017BC4"/></marker>
  </defs>
  <text class="t" x="500" y="28">Four weeks, one pattern: a good primitive and a missing (or chatty) check</text>
  <rect class="bgr" x="25" y="60" width="230" height="180" rx="12"/>
  <text class="tg" x="140" y="95">Week 3</text>
  <text class="t" x="140" y="135">MAC</text>
  <text class="ts" x="140" y="165">checks a message</text>
  <text class="ts" x="140" y="190">was not changed</text>
  <rect class="b" x="265" y="60" width="230" height="180" rx="12"/>
  <text class="tb" x="380" y="95">Week 4</text>
  <text class="t" x="380" y="135">CBC has no check</text>
  <text class="ts" x="380" y="165">a token can be changed</text>
  <text class="ts" x="380" y="190">GCM adds a tag</text>
  <rect class="b" x="505" y="60" width="230" height="180" rx="12"/>
  <text class="tb" x="620" y="95">Week 5</text>
  <text class="t" x="620" y="135">DH has no check</text>
  <text class="ts" x="620" y="165">on who answers</text>
  <text class="ts" x="620" y="190">a tag on each value</text>
  <rect class="bo" x="745" y="60" width="230" height="180" rx="12"/>
  <text class="to" x="860" y="95">Week 6 (today)</text>
  <text class="t" x="860" y="135">a check that talks</text>
  <text class="ts" x="860" y="165">too much: the answer</text>
  <text class="ts" x="860" y="190">leaks the secret</text>
  <path class="a" d="M255,150 H263"/>
  <path class="a" d="M495,150 H503"/>
  <path class="a" d="M735,150 H743"/>
  <text class="ts" x="500" y="290">Today the missing piece is the same idea turned around: what does a failed check tell the attacker?</text>
</svg>
