<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 380" width="760" height="289" role="img" aria-label="The server receives the ciphertext and the tag. Rule 1: check the tag first, before decrypting anything. If it does not match, answer with one FAIL, always the same. If it matches, decrypt and use the data.">
  <title>AEAD open: check the tag first</title>
  <style>
    .b  { fill: #fffdf9; stroke: #017BC4; stroke-width: 2 }
    .bo { fill: #fff6f0; stroke: #E35205; stroke-width: 2 }
    .bg { fill: #f3f4f6; stroke: #6b7280; stroke-width: 1.5 }
    .bgr{ fill: #eef8f0; stroke: #2f855a; stroke-width: 2 }
    .br { fill: #fdeeee; stroke: #c53030; stroke-width: 2 }
    .t  { font: 700 18px system-ui, sans-serif; fill: #16191d; text-anchor: middle }
    .ts { font: 500 14px system-ui, sans-serif; fill: #374151; text-anchor: middle }
    .tm { font: 600 14px ui-monospace, Menlo, monospace; fill: #16191d; text-anchor: middle }
    .tb { font: 700 16px system-ui, sans-serif; fill: #017BC4; text-anchor: middle }
    .to { font: 700 16px system-ui, sans-serif; fill: #E35205; text-anchor: middle }
    .tg { font: 700 16px system-ui, sans-serif; fill: #2f855a; text-anchor: middle }
    .tr { font: 700 16px system-ui, sans-serif; fill: #c53030; text-anchor: middle }
    .a  { stroke: #16191d; stroke-width: 1.8; fill: none; marker-end: url(#ar) }
    .ao { stroke: #E35205; stroke-width: 2.2; fill: none; marker-end: url(#aro) }
    .ab { stroke: #017BC4; stroke-width: 2.2; fill: none; marker-end: url(#arb) }
    .ad { stroke: #E35205; stroke-width: 2.2; fill: none; stroke-dasharray: 6 5; marker-end: url(#aro) }
    @media (prefers-color-scheme: dark) {
      .b  { fill: #151a20; stroke: #4aa3dd } .bo { fill: #2a1c14; stroke: #ff7a3d }
      .bg { fill: #22262b; stroke: #9aa3ad } .bgr { fill: #14251a; stroke: #5fbf8a } .br { fill: #2a1515; stroke: #f08080 }
      .t, .tm { fill: #e6e8ea } .ts { fill: #b8c0c8 }
      .tb { fill: #4aa3dd } .to { fill: #ff7a3d } .tg { fill: #5fbf8a } .tr { fill: #f08080 }
      .a  { stroke: #c9ced3 } .ao, .ad { stroke: #ff7a3d } .ab { stroke: #4aa3dd }
      [fill="#16191d"] { fill: #c9ced3 }
    }
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#16191d"/></marker>
    <marker id="aro" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#E35205"/></marker>
    <marker id="arb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#017BC4"/></marker>
  </defs>
  <text class="t" x="500" y="28">AEAD open(): the two rules in one picture</text>
  <rect class="b" x="40" y="100" width="240" height="70" rx="8"/>
  <text class="tm" x="160.0" y="128.0">receive</text>
  <text class="tm" x="160.0" y="152.0">(c, t)</text>
  <path class="ab" d="M280,135 H340"/>
  <rect class="bo" x="340" y="90" width="280" height="90" rx="8"/>
  <text class="to" x="480.0" y="127.0">Rule 1: check the tag FIRST</text>
  <text class="ts" x="480.0" y="153.0">t == tag(k, nonce, c) ?</text>
  <path class="a" d="M620,115 H700"/>
  <text class="tr" x="660" y="105">no</text>
  <rect class="br" x="700" y="85" width="260" height="60" rx="8"/>
  <text class="tr" x="830.0" y="110.0">FAIL</text>
  <text class="ts" x="830.0" y="130.0">always the same answer</text>
  <text class="tr" x="830" y="170">Rule 2: one FAIL for every failure</text>
  <path class="a" d="M480,182 V240"/>
  <text class="tg" x="500" y="215">yes</text>
  <rect class="bgr" x="340" y="242" width="280" height="70" rx="8"/>
  <text class="tg" x="480.0" y="272.0">decrypt, then use</text>
  <text class="ts" x="480.0" y="292.0">p = dec(k, nonce, c)</text>
  <text class="ts" x="500" y="350">AEAD = encryption + a check that nothing was changed, in one step</text>
</svg>
