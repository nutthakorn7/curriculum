<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 330" width="760" height="251" role="img" aria-label="Left: if the bank still hashes the signature, signing the same message again gives a new valid low-S signature with a different transaction id, so it pays twice. Right: a transaction id taken from the signed message, such as the public key and a unique number inside the message, is the same every time, so the second one is refused.">
  <title>Low-S stops this twin only</title>
  <style>
    .b  { fill: #fffdf9; stroke: #017BC4; stroke-width: 2 }
    .bo { fill: #fff6f0; stroke: #E35205; stroke-width: 2 }
    .bg { fill: #f3f4f6; stroke: #6b7280; stroke-width: 1.5 }
    .bgr{ fill: #eef8f0; stroke: #2f855a; stroke-width: 2 }
    .br { fill: #fdeeee; stroke: #c53030; stroke-width: 2 }
    .t  { font: 700 18px system-ui, sans-serif; fill: #16191d; text-anchor: middle }
    .ts { font: 500 14px system-ui, sans-serif; fill: #374151; text-anchor: middle }
    .tm { font: 600 14px ui-monospace, Menlo, monospace; fill: #16191d; text-anchor: middle }
    .tb { font: 700 16px system-ui, sans-serif; fill: #017BC4; text-anchor: middle }
    .to { font: 700 16px system-ui, sans-serif; fill: #E35205; text-anchor: middle }
    .tg { font: 700 16px system-ui, sans-serif; fill: #2f855a; text-anchor: middle }
    .tr { font: 700 16px system-ui, sans-serif; fill: #c53030; text-anchor: middle }
    .a  { stroke: #16191d; stroke-width: 1.8; fill: none; marker-end: url(#ar) }
    .ao { stroke: #E35205; stroke-width: 2.2; fill: none; marker-end: url(#aro) }
    .ab { stroke: #017BC4; stroke-width: 2.2; fill: none; marker-end: url(#arb) }
    .ad { stroke: #E35205; stroke-width: 2.2; fill: none; stroke-dasharray: 6 5; marker-end: url(#aro) }
    @media (prefers-color-scheme: dark) {
      .b  { fill: #151a20; stroke: #4aa3dd } .bo { fill: #2a1c14; stroke: #ff7a3d }
      .bg { fill: #22262b; stroke: #9aa3ad } .bgr { fill: #14251a; stroke: #5fbf8a } .br { fill: #2a1515; stroke: #f08080 }
      .t, .tm { fill: #e6e8ea } .ts { fill: #b8c0c8 }
      .tb { fill: #4aa3dd } .to { fill: #ff7a3d } .tg { fill: #5fbf8a } .tr { fill: #f08080 }
      .a  { stroke: #c9ced3 } .ao, .ad { stroke: #ff7a3d } .ab { stroke: #4aa3dd }
      [fill="#16191d"] { fill: #c9ced3 }
    }
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#16191d"/></marker>
    <marker id="aro" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#E35205"/></marker>
    <marker id="arb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#017BC4"/></marker>
  </defs>
  <text class="tr" x="250" y="32">Low-S only: id = hash of (r, s)</text>
  <text class="tg" x="750" y="32">Better: id from the signed message</text>
  <rect class="b" x="25" y="55" width="450" height="50" rx="8"/>
  <text class="tb" x="250.0" y="85.0">same message m, signed again</text>
  <rect class="b" x="525" y="55" width="450" height="50" rx="8"/>
  <text class="tb" x="750.0" y="85.0">same message m, signed again</text>
  <path class="a" d="M250,108 V135"/>
  <path class="a" d="M750,108 V135"/>
  <rect class="bg" x="25" y="140" width="215" height="70" rx="8"/>
  <text class="tm" x="132.5" y="167.0">(r1, s1)</text>
  <text class="tm" x="132.5" y="193.0">low-S, valid</text>
  <rect class="bg" x="260" y="140" width="215" height="70" rx="8"/>
  <text class="tm" x="367.5" y="167.0">(r2, s2)</text>
  <text class="tm" x="367.5" y="193.0">low-S, valid</text>
  <rect class="bg" x="525" y="140" width="450" height="70" rx="8"/>
  <text class="tm" x="750.0" y="167.0">id = hash(pk, m)</text>
  <text class="tm" x="750.0" y="193.0">m holds a unique number</text>
  <path class="a" d="M250,213 V240"/>
  <path class="a" d="M750,213 V240"/>
  <rect class="br" x="25" y="245" width="450" height="65" rx="8"/>
  <text class="tr" x="250.0" y="269.5">two different ids</text>
  <text class="ts" x="250.0" y="295.5">paid twice</text>
  <rect class="bgr" x="525" y="245" width="450" height="65" rx="8"/>
  <text class="tg" x="750.0" y="269.5">one id</text>
  <text class="ts" x="750.0" y="295.5">the second one is refused</text>
</svg>
