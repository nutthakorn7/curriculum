<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 360" width="1000" height="360" role="img"
     aria-label="Alice does one Diffie-Hellman handshake with relay, who is posing as Bob, and gets secret 1. Relay does a second handshake with Bob, posing as Alice, and gets secret 2. Relay holds both secrets, so it opens Alice's message with secret 1, reads it, locks it again with secret 2 and sends it on to Bob. Alice and Bob never share a secret with each other.">
  <title>Relay makes two handshakes and holds both secrets</title>
  <style>
    .b  { fill: #fffdf9; stroke: #017BC4; stroke-width: 2 }
    .bo { fill: #fff6f0; stroke: #E35205; stroke-width: 2 }
    .bg { fill: #f3f4f6; stroke: #6b7280; stroke-width: 1.5 }
    .t  { font: 600 17px system-ui, sans-serif; fill: #16191d; text-anchor: middle }
    .ts { font: 500 13px system-ui, sans-serif; fill: #374151; text-anchor: middle }
    .tb { font: 700 15px system-ui, sans-serif; fill: #017BC4; text-anchor: middle }
    .to { font: 700 15px system-ui, sans-serif; fill: #E35205; text-anchor: middle }
    .a  { stroke: #16191d; stroke-width: 1.8; fill: none; marker-end: url(#ar) }
    .ad { stroke: #E35205; stroke-width: 1.8; fill: none; stroke-dasharray: 6 4; marker-end: url(#ar) }
    @media (prefers-color-scheme: dark) {
      .b  { fill: #151a20; stroke: #4aa3dd } .bo { fill: #2a1c14; stroke: #ff7a3d }
      .bg { fill: #22262b; stroke: #9aa3ad }
      .t { fill: #e6e8ea } .ts { fill: #b8c0c8 }
      .tb { fill: #4aa3dd } .to { fill: #ff7a3d }
      .a  { stroke: #c9ced3 } .ad { stroke: #ff7a3d }
      [fill="#16191d"] { fill: #c9ced3 }
    }
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#16191d"/></marker>
  </defs>

  <rect class="b" x="20" y="40" width="190" height="64" rx="8"/><text class="t" x="115" y="68">Alice</text><text class="ts" x="115" y="90">thinks she talks to Bob</text>
  <rect class="bo" x="405" y="40" width="190" height="64" rx="8"/><text class="to" x="500" y="68">relay</text><text class="ts" x="500" y="90">the attacker in the middle</text>
  <rect class="b" x="790" y="40" width="190" height="64" rx="8"/><text class="t" x="885" y="68">Bob</text><text class="ts" x="885" y="90">thinks he talks to Alice</text>

  <path class="a" d="M215,72 H400"/><text class="tb" x="307" y="62">handshake 1</text>
  <path class="a" d="M600,72 H785"/><text class="tb" x="692" y="62">handshake 2</text>

  <rect class="bg" x="100" y="128" width="230" height="44" rx="8"/><text class="t" x="215" y="156">secret 1: Alice + relay</text>
  <rect class="bg" x="670" y="128" width="230" height="44" rx="8"/><text class="t" x="785" y="156">secret 2: relay + Bob</text>
  <path class="a" d="M215,112 V124"/><path class="a" d="M785,112 V124"/>

  <path class="ad" d="M215,178 L440,222"/>
  <path class="ad" d="M785,178 L560,222"/>
  <rect class="bo" x="260" y="226" width="480" height="82" rx="10"/>
  <text class="to" x="500" y="252">relay holds BOTH secrets</text>
  <text class="ts" x="500" y="274">opens Alice's message with secret 1 → reads it</text>
  <text class="ts" x="500" y="294">locks it again with secret 2 → sends it to Bob</text>

  <text class="ts" x="500" y="338">Alice and Bob never share a secret with each other — and neither of them can tell.</text>
</svg>
