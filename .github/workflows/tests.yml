name: tests

# Runs the parity/render/crossref test suite on every push and PR. Mirrors the
# `tests:` job in software-security/.github/workflows/security-ci.yml — closes
# the same gap: pull requests here showed no checks at all, so the suite only
# ever ran on the author's laptop, when the author remembered. That is exactly
# how a real defect (a symlink-following bug in render.py, an SSTI in
# crossref.py) sat in an open, mergeable PR unnoticed.

on:
  push:
    branches: [ master ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Tests (parity + render + crossref)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest
      - name: Run the suite
        run: python -m pytest tests/ -q
